services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: support
      POSTGRES_PASSWORD: support
      POSTGRES_DB: support
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U support"]
      interval: 3s
      retries: 10

  api:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://support:support@db:5432/support
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    # The default knowledge base (backend/knowledge_base.md) is baked into the
    # image. To use your own file, mount it over /app/knowledge_base.md or set
    # KNOWLEDGE_BASE_PATH and mount it there:
    #   volumes:
    #     - ./my-knowledge-base.md:/app/my-knowledge-base.md:ro
    #   environment:
    #     KNOWLEDGE_BASE_PATH: my-knowledge-base.md

  web:
    build: ./frontend
    depends_on:
      - api
    ports:
      - "8010:80"

volumes:
  pgdata:
